name: Build Windows DLL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Release x64
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Prepare vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP "vcpkg"
          $binaryCache = Join-Path $env:RUNNER_TEMP "vcpkg-binary-cache"
          git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot
          git -C $vcpkgRoot checkout a39a74405f277773aba08018bb797cb4a6614d0c
          & (Join-Path $vcpkgRoot "bootstrap-vcpkg.bat") -disableMetrics
          New-Item -ItemType Directory -Path $binaryCache -Force | Out-Null
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_DEFAULT_BINARY_CACHE=$binaryCache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-ports/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Configure and build
        shell: pwsh
        run: |
          & "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -SkipAutomaticLocation
          cmake --preset final-universal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset final-universal-release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage flat artifact
        shell: pwsh
        run: |
          $artifactDir = Join-Path $PWD "artifact"
          New-Item -ItemType Directory -Path $artifactDir -Force | Out-Null

          $dllCandidates = @(
            Get-ChildItem -LiteralPath "bin/final-universal" -Filter "winhttp.dll" -File -Recurse
          )
          if ($dllCandidates.Count -ne 1) {
            $foundPaths = ($dllCandidates | ForEach-Object { $_.FullName }) -join "`n"
            throw "Expected exactly one built winhttp.dll, found $($dllCandidates.Count).`n$foundPaths"
          }

          Write-Host "Staging DLL: $($dllCandidates[0].FullName)"
          Copy-Item -LiteralPath $dllCandidates[0].FullName -Destination $artifactDir
          Copy-Item -LiteralPath "resources/mod_config.ini" -Destination $artifactDir
          Copy-Item -LiteralPath "resources/mod_DamageSettings.ini" -Destination $artifactDir

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HFW-Gameplay-Tweaks-zh-CN
          if-no-files-found: error
          retention-days: 30
          path: |
            artifact/winhttp.dll
            artifact/mod_config.ini
            artifact/mod_DamageSettings.ini
